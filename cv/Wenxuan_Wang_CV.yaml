cv:
  name: Wenxuan Wang
  headline: AI PhD Student · AI Agents · Image Generation Agents
  email: wangwenxuan@pjlab.org.cn
  website: https://yummytanmo.github.io/
  social_networks:
    - network: GitHub
      username: Yummytanmo
    - network: Google Scholar
      username: kHhrf6-6Bx4C
  sections:
    Summary:
      - Joint Ph.D. student at Harbin Institute of Technology and Shanghai AI Laboratory, working on AI agents.
    Education:
      - institution: Harbin Institute of Technology
        area: Faculty of Computing
        degree: Ph.D. Student
        start_date: 2026-08
        end_date: present
        summary: 'Joint training with Shanghai AI Laboratory and HIT-SCIR. Advisors: Yu Cheng and Weinan Zhang.'
      - institution: Harbin Institute of Technology
        area: Artificial Intelligence, School of Future Technology
        degree: Bachelor's
        start_date: 2022-08
        end_date: 2026-06
    Expertise:
      - label: Research
        details: Skill Learning, Agent Memory, Self-Evolving Agents, Generative Models, Text-to-Image Agents, Agent–Model Co-evolution
      - label: Systems
        details: Skill Evolution Pipelines, Agent Benchmarking and Evaluation, Multi-Agent Social Media Simulation, Autonomous Agent Control
    Research & Publications:
      - title: Internalizing Agent Experience into Diffusion Model Weights via On-Policy Context Distillation
        authors:
          - '**Wenxuan Wang**'
          - Zekai Liu
          - Weinan Zhang
          - Yu Cheng
          - Yang Yang
        journal: Under review, 2026
        url: https://arxiv.org/abs/2610.07250
        role: Co-first author (listed first)
        links: '[Paper](https://arxiv.org/abs/2610.07250) · [Code](https://github.com/Yummytanmo/D-OPCD-CoEvolution)'
        highlights:
          - Introduced D-OPCD to distill agent-refined prompts into diffusion model weights, retaining agent benefits when generating directly from the original query.
          - Raised the average direct-generation score from **60.52 to 65.09 across four benchmarks**. A second skill-evolution round added **1.83 points** over a skill-free harness on the updated generator.
      - title: 'SubtleMemory: A Benchmark for Fine-Grained Relational Memory Discrimination in Long-Horizon AI Agents'
        authors:
          - '**Wenxuan Wang**'
          - Haoyu Sun
          - Fukuan Hou
          - Mingyang Song
          - Weinan Zhang
          - Yu Cheng
          - Yang Yang
        journal: Findings of EMNLP 2026
        url: https://arxiv.org/abs/2606.05761
        role: Co-first author (listed first)
        links: '[Paper](https://arxiv.org/abs/2606.05761) · [Code](https://github.com/Yummytanmo/SubtleMemory)'
        highlights:
          - Introduced a benchmark testing whether long-horizon agents distinguish complementary, nuanced, and contradictory relations among memories embedded in user-agent histories.
          - Built **1,522 evaluation instances over 10 long histories**, with diagnostic protocols separating failures in memory preservation, retrieval, and downstream reasoning.
      - title: 'Agent Planning Benchmark: A Diagnostic Framework for Planning Capabilities in LLM Agents'
        authors:
          - Haoyu Sun
          - '**Wenxuan Wang**'
          - Mingyang Song
          - Jujie He
          - Weinan Zhang
          - Yang Liu
          - Yang Yang
          - Yu Cheng
        journal: Findings of EMNLP 2026
        url: https://arxiv.org/abs/2606.04874
        role: Co-first author (listed second)
        links: '[Paper](https://arxiv.org/abs/2606.04874) · [Code](https://github.com/Mikivishy/AgentPlanningBenchmark)'
        highlights:
          - Co-authored a planning-specific diagnostic benchmark with **4,209 multimodal cases across 22 domains and five settings**, separating planning quality from execution outcomes.
          - Evaluated **12 multimodal LLMs** on planning and tool-related robustness; validated APB-guided refinement on **200 ToolSandbox and 200 tau-squared-bench tasks**.
    Selected Projects:
      - name: Multi-Agent Social Media Simulation Sandbox
        start_date: 2024-09
        end_date: 2025-01
        summary: A multi-agent sandbox for simulating social media interactions and studying agent behavior.
        highlights:
          - Contributed to system iteration and performance optimization, improving the efficiency of multi-agent simulations.
      - name: Autonomous Social Media Agent System
        start_date: 2025-03
        end_date: 2025-05
        summary: An autonomous social media agent system for exploring agent autonomy and influence in online interactions.
        highlights:
          - Developed the central control module and supported real-world testing and iterative refinement of the system.
    Internship Experience:
      - company: Shanghai AI Laboratory
        position: Intern
        start_date: 2025-10
        end_date: 2026-10
        highlights:
          - 'Researched AI agent memory, planning, and experience distillation, resulting in **three co-first-authored papers**: two accepted to Findings of EMNLP 2026 and one manuscript under review.'
    Selected Honors & Awards:
      - name: Outstanding Graduate, Harbin Institute of Technology
        date: 2026-05
      - name: Song Qingling Grant
        date: 2026-03
      - name: Second Prize, ASC Student Supercomputer Challenge
        date: 2025-05
      - name: Samsung Scholarship
        date: 2025-03
      - name: Song Qingling Grant
        date: 2025-03
      - name: First Prize, National College Student Mathematics Competition (Heilongjiang Division)
        date: 2023-11
design:
